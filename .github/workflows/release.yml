name: Release (tag + prod deploy on version bump)

# Deployment policy (nanocoder-inspired, production-gated):
# - PR to main        -> CI + Vercel PREVIEW deploy (automatic, the "dev" URL)
# - merge to main     -> Vercel sees the push, but the production branch is
#                        'release', so it builds a preview only. Prod does NOT move.
# - version bump merge-> this workflow fast-forwards 'release' to main, which
#                        triggers the Vercel PRODUCTION deploy, tags vX.Y.Z and
#                        creates the GitHub Release.
# One-time dashboard setup (owner): Vercel -> astraa -> Settings -> Git ->
#   Production Branch = 'release'. (The REST API rejects this key; UI-only.)

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-gate:
    name: Build gate on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present
      - run: npm run build
        env:
          KV_REST_API_URL: https://ci-placeholder.upstash.io
          KV_REST_API_TOKEN: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder

  release:
    name: Release if version bumped
    needs: build-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: New version check
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "ℹ️ v$VERSION already tagged — no release, no prod deploy"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ New version detected: v$VERSION — cutting release"
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

      - name: Fast-forward release branch to main (triggers prod deploy)
        if: steps.check.outputs.should-release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/release

      - name: Tag vX.Y.Z
        if: steps.check.outputs.should-release == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          git tag -a "v$VERSION" -m "release v$VERSION"
          git push origin "v$VERSION"

      - name: GitHub Release with notes
        if: steps.check.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          PREV=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "## What changed"
            echo ""
            git log --format='- %s (%h)' "${PREV}..HEAD" | grep -vE '^- (chore\(release\))' || true
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
