name: Prod Deploy Guard

# nanocoder-style deployment policy for astraa:
# - PRs to main -> Vercel builds a PREVIEW deployment automatically (Vercel Git
#   integration). Previews are the "dev deployment": always on, no branch needed.
# - Merges to main do NOT go straight to production. Vercel's auto prod deploy
#   is disabled; this workflow instead runs the build as a gate on main.
# - Production deploys happen ONLY when a new version is cut: the release job
#   tags vX.Y.Z (see release.yml) and runs `vercel deploy --prod`.

on:
  push:
    branches: [main]

concurrency:
  group: prod-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-gate:
    name: Build gate (no prod deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present
      - run: npm run build
        env:
          # build needs the env vars; use placeholder-free dummies for CI only
          KV_REST_API_URL: https://ci-placeholder.upstash.io
          KV_REST_API_TOKEN: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder

  prod-deploy:
    name: Prod deploy on new version
    needs: build-gate
    if: github.repository == 'puri-adityakumar/astraa'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.version.outputs.should-deploy }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this push introduces a new version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.should-deploy == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Deploy to production
        if: steps.version.outputs.should-deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Tag the released version
        if: steps.version.outputs.should-deploy == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "release v$VERSION"
          git push origin "v$VERSION"

      - name: GitHub Release
        if: steps.version.outputs.should-deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "## What changed"
            echo ""
            git log --format='- %s (%h)' "${PREV}..HEAD" | grep -vE '^- (chore\(release\))' || true
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
